name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/zalo-mini-app/package-lock.json
      - name: Install core dependencies
        run: npm ci
      - name: Check learning core and content
        run: npm run check
      - name: Install Zalo Mini App dependencies
        run: npm --prefix apps/zalo-mini-app ci
      - name: Typecheck Zalo Mini App
        run: npm run check:zalo
      - name: Build Zalo Mini App production bundle
        run: npm run build:zalo
